<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signin.css">
</head>

<body>
    <div id="one">
        <div id="left">
            <h1 id="two">Sign In </h1>
            <form action="" id="two">
                <div id="three">
                    <i>
                        <img src="mdi_user.png" alt="user icon">
                    </i>
                    <input type="text" placeholder="Enter Username">
                </div>
                <div id="four">
                    <i>
                        <img src="mdi_password.png" alt="password icon">
                    </i>
                    <input type="text" placeholder="Enter Password">
                </div>
                <div id="five">
                    <input type="checkbox">
                    <label for="text">Remember Me</label><br><br>

                </div>
                <div id="six">
                    <button>LogIn</button>
                </div>
                <div id="eight">
                    <span>Or, LogIn with</span>
                    <a href="#" id="facebook">

                        <img src="fb.png" alt="facebook icon">

                    </a>

                    <a href="#" id="google">

                        <img src="ggle.png" alt="google icon">

                    </a>

                    <a href="#" id="meta">

                        <img src="meta.png" alt="workshop">

                    </a>
                </div>
                <div id="nine">
                    <p>
                        Don't have an account?
                        <a href="#">About</a>
                    </p>

                </div>

            </form>
        </div>
        <div id="right">
            <img src="ach3 1.png" alt="image of a girl signing up.">
        </div>
    </div>
</body>

</html>
